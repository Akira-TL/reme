name: reme-roadshow

services:
  frontend:
    image: ${REME_FRONTEND_IMAGE:-reme-frontend:roadshow}
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.frontend
    container_name: reme-frontend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ${REME_FRONTEND_CONFIG_FILE:-./reme-config.roadshow.js}:/usr/share/nginx/html/reme-config.js:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  backend:
    image: ${REME_BACKEND_IMAGE:-reme-backend:roadshow}
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.backend
    container_name: reme-backend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${REME_BACKEND_ENV_FILE:-/etc/reme/backend.env}
    tmpfs:
      - /tmp
    volumes:
      - ${REME_MODELS_DIR:-../../models}:/app/models:ro
      - backend-artifacts:/app/artifacts
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/api/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  history-loader:
    image: ${REME_BACKEND_IMAGE:-reme-backend:roadshow}
    container_name: reme-history-loader
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${REME_BACKEND_ENV_FILE:-/etc/reme/backend.env}
    command:
      - python
      - -m
      - reme.runtime.history.demo_loader
      - --fixture
      - /run/reme/reme-family-history.json
    depends_on:
      relay:
        condition: service_healthy
    tmpfs:
      - /tmp
    volumes:
      - backend-artifacts:/app/artifacts
      - ${REME_HISTORY_FIXTURE_FILE:-./fixtures/reme-aug-2026-family-summary-v2.json}:/run/reme/reme-family-history.json:ro
    networks:
      - proxy

  relay:
    image: ${REME_RELAY_IMAGE:-reme-relay:roadshow}
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.relay
    container_name: reme-relay
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp/wrangler-home
    tmpfs:
      - /tmp
      - /app/.wrangler
    volumes:
      - ${REME_RELAY_VARS_FILE:-/etc/reme/relay.dev.vars}:/run/reme/relay.dev.vars:ro
      - relay-state:/var/lib/reme-relay
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  backend-artifacts:
  relay-state:

networks:
  proxy:
    external: true
    name: ${REME_PROXY_NETWORK:-zhixia-biaoshu_frontend}
