server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /home;
    }

    location = /viewer { return 308 /family; }
    location = /viewer.html { return 308 /family; }
    location = /typical-demo { return 308 /debug; }
    location = /typical-demo.html { return 308 /debug; }
    location = /monitor { return 308 /home; }
    location = /monitor.html { return 308 /home; }

    location = /reme-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
