[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reme"
version = "0.1.0"
description = "Privacy-first care agent prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Reme Team" }]
dependencies = [
  "numpy>=2.0",
]

[project.scripts]
reme-demo = "reme.demo:entrypoint"
reme-decision-server = "reme.decision.server:main"
reme-decision-smoke = "reme.decision.mimo.adapter:main"
reme-mimo-experiment = "reme.decision.mimo.experiment:main"
reme-visual-precut = "reme.decision.visual:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]
pose = [
  "ai-edge-litert>=2.1",
  "opencv-python-headless>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/reme"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["reme"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "ai_edge_litert", "ai_edge_litert.*"]
ignore_missing_imports = true
