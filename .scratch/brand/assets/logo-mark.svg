<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reme 图形标：无面孔的火柴人抬手问候，身下一道暖色怀抱弧">
  <!-- 怀抱弧：视野锥倒过来，是一只托住的手 -->
  <path d="M 42 208 Q 122 248 200 196" fill="none" stroke="#E8794A" stroke-width="13" stroke-linecap="round"/>
  <g fill="none" stroke="#1E2E3E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- 无面孔的头：5 个面部关键点折叠成一个空圆 -->
    <circle cx="118" cy="52" r="16" stroke-width="9.5"/>
    <!-- 躯干 -->
    <path d="M 94 92 L 142 90"/>
    <path d="M 94 92 L 103 142"/>
    <path d="M 142 90 L 131 142"/>
    <path d="M 103 142 L 131 142"/>
    <!-- 左臂（松弛） -->
    <path d="M 94 92 L 80 118 L 74 144"/>
    <!-- 右臂（抬手问候） -->
    <path d="M 142 90 L 166 74 L 178 44"/>
    <!-- 左腿 -->
    <path d="M 103 142 L 98 170 L 96 196"/>
    <!-- 右腿（轻迈半步） -->
    <path d="M 131 142 L 138 170 L 143 196"/>
  </g>
  <!-- 12 个身体关键点 -->
  <g fill="#1E2E3E">
    <circle cx="94" cy="92" r="7"/>
    <circle cx="142" cy="90" r="7"/>
    <circle cx="80" cy="118" r="7"/>
    <circle cx="166" cy="74" r="7"/>
    <circle cx="74" cy="144" r="7"/>
    <circle cx="103" cy="142" r="7"/>
    <circle cx="131" cy="142" r="7"/>
    <circle cx="98" cy="170" r="7"/>
    <circle cx="138" cy="170" r="7"/>
    <circle cx="96" cy="196" r="7"/>
    <circle cx="143" cy="196" r="7"/>
  </g>
  <!-- 先开口问候的那只手：唯一的暖色关键点 -->
  <circle cx="178" cy="44" r="8" fill="#E8794A"/>
</svg>
